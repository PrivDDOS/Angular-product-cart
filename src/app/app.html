<main class="container w-full min-h-screen flex justify-center items-center flex-col my-16">
    <h1 class="me-auto font-[700] text-[28px]">Desserts</h1>
    <div class="w-[50%] h-full grid grid-cols-3 gap-1">
        @for(product of products; track $index) {
            <div class="flex flex-col justify-center">
                <div class="relative flex flex-col">
                    <img [src]="product.image.desktop" [alt]="product.name" class="w-[12rem] h-[12rem]">
                    <div class="absolute flex flex-row justify-between">
                        <button class="border-none">
                            <img src="/assets/images/icon-decrement-quantity.svg" alt="minus">
                        </button>
                        <div>
                            {{ quantity }}
                        </div>
                        <button class="border-none">
                            <img src="/assets/images/icon-increment-quantity.svg" alt="plus">
                        </button>
                    </div>
                </div>

                <p>{{ product.name }}</p>
                <p>{{ product.category }}</p>
                <p>{{ product.price }}</p>

            </div>
        }
    </div>
    <div class="w-[40%] h-full"></div>
</main>
